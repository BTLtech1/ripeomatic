; BTL Ripe-O-Matic — PlatformIO project (the Arduino IDE works too: open ripeomatic/ripeomatic.ino)
;   pio run -t upload && pio device monitor
[platformio]
src_dir = ripeomatic
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_flags = -Wall -Wextra
; OTA after the first USB flash: uncomment and set your device's hostname
; upload_protocol = espota
; upload_port = ripeomatic.local
