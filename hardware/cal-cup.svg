<g font-size="14" fill="#1d1d1b">
<line x1="315.0" y1="290.65127534882777" x2="470" y2="290.65127534882777" stroke="#555"/><text x="478" y="295.65127534882777"><tspan font-weight="700">20 nickels = 100 g</tspan></text><text x="478" y="313.65127534882777" fill="#555">the tube keeps the stack upright;</text><text x="478" y="331.65127534882777" fill="#555">40 nickels (200 g) stand half out of it</text>
<line x1="412.5" y1="128.15127534882777" x2="470" y2="118.15127534882777" stroke="#555"/><text x="478" y="123.15127534882777"><tspan font-weight="700">flat rim</tspan>: a small jar can sit here instead</text>
<line x1="287.05" y1="460.85" x2="470" y2="430.85" stroke="#555"/><text x="478" y="435.85"><tspan font-weight="700">cone seat</tspan> rests on the dome in a ring,</text><text x="478" y="453.85" fill="#555">so it can't rock</text>
<line x1="302.65" y1="503.75" x2="470" y2="513.75" stroke="#555"/><text x="478" y="518.75"><tspan font-weight="700">sleeve</tspan> round the pad's straight part</text>
<line x1="276.0" y1="481.0" x2="470" y2="570" stroke="#35591f"/><text x="478" y="575" fill="#35591f"><tspan font-weight="700">pad</tspan> (glued on, stays as it is)</text>
</g></svg>