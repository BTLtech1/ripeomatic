<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="system-ui,Segoe UI,sans-serif">
<rect width="760" height="600" fill="#f7f6f1"/><text x="24" y="36" font-size="21" font-weight="700" fill="#1d1d1b">Calibration cup, cut in half</text>
<text x="24" y="58" font-size="14" fill="#555">Sits on the pad's dome and holds the weights. Machine standing on its motor end, pad up.</text>
