<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
  <title>Ripe-O-Matic wiring, the easy version</title>
  <rect width="980" height="760" fill="#f7f6f1"/>

  <text x="28" y="40" font-size="22" font-weight="700" fill="#1d1d1b">Ripe-O-Matic wiring</text>
  <text x="28" y="62" font-size="13" fill="#555">Match the words printed next to each pin. Unplug the USB while you wire.</text>

  <g transform="translate(0 26)">
  <!-- ============ wires (drawn first, boards on top) ============ -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1: motor signals. ESP right side -> ULN IN pins -->
    <path d="M450 224 H560 V210 H660" stroke="#e8761a"/>   <!-- D19 -> IN4 -->
    <path d="M450 248 H560 V234 H660" stroke="#c9a100"/>   <!-- D18 -> IN3 -->
    <path d="M450 296 H540 V258 H660" stroke="#2e9e4f"/>   <!-- TX2 -> IN2 -->
    <path d="M450 320 H580 V282 H660" stroke="#2f6fd6"/>   <!-- RX2 -> IN1 -->
    <!-- 2: power -->
    <path d="M450 416 H630 V360 H660" stroke="#222"/>        <!-- GND -> minus -->
    <path d="M330 440 H310 V522 H462 A8 8 0 0 1 478 522 H645 V384 H660" stroke="#d62828"/>  <!-- VIN -> plus, hops over 3V3 -->
    <!-- 4: sensor -->
    <path d="M135 300 V548 H470 V440 H450" stroke="#a03cc8"/>  <!-- leg 1 -> 3V3 -->
    <path d="M155 300 V416 H330" stroke="#222"/>                <!-- leg 2 -> GND -->
    <path d="M175 300 V322 H250 V176 H330" stroke="#0aa5a5"/>  <!-- leg 3 -> D34 -->
    <!-- 5: servo -->
    <path d="M150 610 H200 V416" stroke="#7a4a21"/>            <!-- brown -> shares GND -->
    <path d="M150 628 H290 V272 H330" stroke="#f08c00"/>       <!-- orange -> D25 -->
    <path d="M150 646 H310 V522" stroke="#d62828"/>            <!-- red -> shares VIN -->
  </g>

  <!-- ============ ESP32 ============ -->
  <rect x="330" y="58" width="120" height="448" rx="8" fill="#121417" stroke="#000"/>
  <!-- antenna -->
  <path d="M362 64 V78 H372 V68 H382 V78 H392 V68 H402 V78 H412 V68 H418" fill="none" stroke="#3a3f45" stroke-width="2"/>
  <!-- metal module (on the real board it covers the top half, between the two pin rows) -->
  <rect x="372" y="84" width="36" height="200" rx="3" fill="#b9bec3" stroke="#80868c"/>
  <text x="0" y="0" transform="translate(397 184) rotate(-90)" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2f33">ESP-32</text>
  <text x="0" y="0" transform="translate(381 184) rotate(-90)" text-anchor="middle" font-size="7" fill="#4a4f54">metal chip side up</text>
  <!-- small parts -->
  <rect x="372" y="340" width="34" height="34" rx="2" fill="#1d1f22" stroke="#33373b"/>
  <rect x="376" y="390" width="22" height="30" rx="2" fill="#2a2d30"/>
  <!-- buttons and USB-C -->
  <rect x="344" y="466" width="18" height="18" rx="3" fill="#cfd3d6"/><circle cx="353" cy="475" r="5" fill="#8d9296"/>
  <text x="353" y="497" text-anchor="middle" font-size="9" fill="#cfd6dd">EN</text>
  <rect x="418" y="466" width="18" height="18" rx="3" fill="#cfd3d6"/><circle cx="427" cy="475" r="5" fill="#8d9296"/>
  <text x="427" y="497" text-anchor="middle" font-size="9" fill="#cfd6dd">BOOT</text>
  <rect x="374" y="478" width="32" height="36" rx="6" fill="#c3c8cc" stroke="#7d848a"/>
  <text x="485" y="498" font-size="11" fill="#444">← USB: plug in last</text>
  <!-- left pins: EN VP VN D34 D35 D32 D33 D25 D26 D27 D14 D12 D13 GND VIN -->
  <g font-size="10" fill="#7f8a96">
    <text x="342" y="107">EN</text><text x="342" y="131">VP</text><text x="342" y="155">VN</text>
    <text x="342" y="203">D35</text><text x="342" y="227">D32</text><text x="342" y="251">D33</text><text x="342" y="275">D25</text>
    <text x="342" y="299">D26</text><text x="342" y="323">D27</text><text x="342" y="347">D14</text><text x="342" y="371">D12</text><text x="342" y="395">D13</text>
  </g>
  <g font-size="12" font-weight="700" fill="#fff">
    <text x="342" y="180">D34</text><text x="342" y="420">GND</text><text x="342" y="444">VIN</text>
  </g>
  <!-- right pins: D23 D22 TX0 RX0 D21 D19 D18 D5 TX2 RX2 D4 D2 D15 GND 3V3 -->
  <g font-size="10" fill="#7f8a96" text-anchor="end">
    <text x="438" y="107">D23</text><text x="438" y="131">D22</text><text x="438" y="155">TX0</text><text x="438" y="179">RX0</text><text x="438" y="203">D21</text>
    <text x="438" y="275">D5</text><text x="438" y="347">D4</text><text x="438" y="371">D2</text><text x="438" y="395">D15</text>
  </g>
  <g font-size="12" font-weight="700" fill="#fff" text-anchor="end">
    <text x="438" y="228">D19</text><text x="438" y="252">D18</text><text x="438" y="300">TX2</text><text x="438" y="324">RX2</text>
    <text x="438" y="420">GND</text><text x="438" y="444">3V3</text>
  </g>
  <g fill="#d9b64a">
    <rect x="326" y="100" width="8" height="8"/><rect x="326" y="124" width="8" height="8"/><rect x="326" y="148" width="8" height="8"/><rect x="326" y="172" width="8" height="8"/>
    <rect x="326" y="196" width="8" height="8"/><rect x="326" y="220" width="8" height="8"/><rect x="326" y="244" width="8" height="8"/><rect x="326" y="268" width="8" height="8"/>
    <rect x="326" y="292" width="8" height="8"/><rect x="326" y="316" width="8" height="8"/><rect x="326" y="340" width="8" height="8"/><rect x="326" y="364" width="8" height="8"/>
    <rect x="326" y="388" width="8" height="8"/><rect x="326" y="412" width="8" height="8"/><rect x="326" y="436" width="8" height="8"/>
    <rect x="446" y="100" width="8" height="8"/><rect x="446" y="124" width="8" height="8"/><rect x="446" y="148" width="8" height="8"/><rect x="446" y="172" width="8" height="8"/>
    <rect x="446" y="196" width="8" height="8"/><rect x="446" y="220" width="8" height="8"/><rect x="446" y="244" width="8" height="8"/><rect x="446" y="268" width="8" height="8"/>
    <rect x="446" y="292" width="8" height="8"/><rect x="446" y="316" width="8" height="8"/><rect x="446" y="340" width="8" height="8"/><rect x="446" y="364" width="8" height="8"/>
    <rect x="446" y="388" width="8" height="8"/><rect x="446" y="412" width="8" height="8"/><rect x="446" y="436" width="8" height="8"/>
  </g>

  <!-- ============ ULN2003 ============ -->
  <rect x="660" y="172" width="170" height="250" rx="6" fill="#1b6e3c" stroke="#0f4625"/>
  <text x="745" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ULN2003</text>
  <text x="745" y="337" text-anchor="middle" font-size="11" fill="#d5ecd9">motor driver</text>
  <rect x="725" y="232" width="56" height="40" rx="2" fill="#151515"/>
  <g fill="#ff5252"><circle cx="800" cy="215" r="5"/><circle cx="800" cy="235" r="5"/><circle cx="800" cy="255" r="5"/><circle cx="800" cy="275" r="5"/></g>
  <g font-size="12" font-weight="700" fill="#fff">
    <text x="672" y="214">IN4</text><text x="672" y="238">IN3</text><text x="672" y="262">IN2</text><text x="672" y="286">IN1</text>
    <text x="674" y="364">−</text><text x="672" y="388">+</text>
  </g>
  <text x="690" y="379" font-size="10" fill="#d5ecd9">5–12V</text>
  <g fill="#d9b64a">
    <rect x="656" y="206" width="8" height="8"/><rect x="656" y="230" width="8" height="8"/><rect x="656" y="254" width="8" height="8"/><rect x="656" y="278" width="8" height="8"/>
    <rect x="656" y="356" width="8" height="8"/><rect x="656" y="380" width="8" height="8"/>
  </g>
  <!-- jumper cap -->
  <rect x="740" y="370" width="14" height="30" rx="2" fill="#111" stroke="#555"/>
  <path d="M756 385 H860" stroke="#666" stroke-width="1.2"/>
  <text x="864" y="381" font-size="12" font-weight="700" fill="#1d1d1b">jumper cap:</text>
  <text x="864" y="396" font-size="12" fill="#1d1d1b">leave it on</text>
  <!-- motor socket -->
  <rect x="705" y="160" width="80" height="16" rx="2" fill="#f4f4f0" stroke="#999"/>

  <!-- ============ motor ============ -->
  <g fill="none" stroke-width="3">
    <path d="M725 128 V160" stroke="#2f6fd6"/><path d="M735 128 V160" stroke="#e86fa0"/><path d="M745 128 V160" stroke="#e6c000"/>
    <path d="M755 128 V160" stroke="#e8761a"/><path d="M765 128 V160" stroke="#d62828"/>
  </g>
  <rect x="680" y="64" width="130" height="10" rx="5" fill="#b9bdc1"/>
  <circle cx="745" cy="90" r="38" fill="#c9cdd1" stroke="#8e9398" stroke-width="2"/>
  <circle cx="745" cy="78" r="9" fill="#e9c46a" stroke="#a5852d"/>
  <text x="745" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#333">28BYJ-48</text>
  <text x="820" y="128" font-size="12" fill="#1d1d1b">motor plug: fits one way</text>

  <!-- ============ hall sensor ============ -->
  <text x="60" y="186" font-size="13" font-weight="700" fill="#1d1d1b">Hall sensor (SS49E)</text>
  <text x="60" y="203" font-size="11" fill="#555">writing toward you, legs down</text>
  <path d="M120 270 L120 238 L130 228 L180 228 L190 238 L190 270 Z" fill="#1a1a1a"/>
  <text x="155" y="254" text-anchor="middle" font-size="11" fill="#ddd">49E</text>
  <g stroke="#9aa0a6" stroke-width="3"><path d="M135 270 V300"/><path d="M155 270 V300"/><path d="M175 270 V300"/></g>

  <!-- ============ servo ============ -->
  <rect x="34" y="620" width="116" height="16" rx="2" fill="#2f5fb8"/>
  <rect x="50" y="596" width="84" height="64" rx="4" fill="#3b76d6" stroke="#274f96" stroke-width="2"/>
  <circle cx="74" cy="628" r="13" fill="#e9edf2" stroke="#8e9398" stroke-width="2"/><rect x="70" y="600" width="8" height="30" rx="4" fill="#fff" stroke="#8e9398"/>
  <text x="110" y="633" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">servo</text>
  <text x="34" y="684" font-size="13" font-weight="700" fill="#1d1d1b">Servo (MG90S) for the back gate</text>
  <text x="34" y="701" font-size="11" fill="#555">brown and red share pins: use a splitter, breadboard or splice</text>
  <!-- shared-pin joints -->
  <circle cx="200" cy="416" r="7" fill="#222" stroke="#fff" stroke-width="2"/>
  <circle cx="310" cy="522" r="7" fill="#d62828" stroke="#fff" stroke-width="2"/>
  <g font-size="11" font-weight="700">
    <text x="158" y="606" fill="#7a4a21">brown</text><text x="212" y="623" fill="#c97400">orange → D25</text><text x="212" y="662" fill="#d62828">red</text>
    <text x="206" y="440" fill="#7a4a21">joins GND</text><text x="318" y="540" fill="#d62828">joins VIN</text>
  </g>

  <!-- wire labels -->
  <g font-size="11" font-weight="700">
    <text x="258" y="170" fill="#0aa5a5">D34</text>
    <text x="216" y="410" fill="#222">GND</text>
    <text x="400" y="566" fill="#a03cc8">3V3</text>
    <text x="520" y="514" fill="#d62828">VIN → +</text>
    <text x="520" y="410" fill="#222">GND → −</text>
  </g>

  <!-- step badges -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="608" cy="176" r="13" fill="#1d1d1b"/><text x="608" y="181" fill="#fff">1</text>
    <circle cx="608" cy="470" r="13" fill="#1d1d1b"/><text x="608" y="475" fill="#fff">2</text>
    <circle cx="660" cy="128" r="13" fill="#1d1d1b"/><text x="660" y="133" fill="#fff">3</text>
    <circle cx="96" cy="300" r="13" fill="#1d1d1b"/><text x="96" y="305" fill="#fff">4</text>
    <circle cx="20" cy="600" r="13" fill="#1d1d1b"/><text x="20" y="605" fill="#fff">5</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#1d1d1b">
    <rect x="690" y="452" width="270" height="200" rx="8" fill="#fff" stroke="#d8d6cc"/>
    <text x="704" y="476"><tspan font-weight="700">1</tspan>  4 wires: D19, D18, TX2, RX2</text>
    <text x="722" y="492" fill="#555">to IN4, IN3, IN2, IN1</text>
    <text x="704" y="514"><tspan font-weight="700">2</tspan>  power: VIN to +, GND to −</text>
    <text x="704" y="536"><tspan font-weight="700">3</tspan>  motor plug into the white socket</text>
    <text x="704" y="558"><tspan font-weight="700">4</tspan>  sensor: 3V3, GND, D34</text>
    <text x="722" y="574" fill="#555">(can wait until the motor works)</text>
    <text x="704" y="598"><tspan font-weight="700">5</tspan>  servo: orange to D25,</text>
    <text x="722" y="614">red to VIN, brown to GND</text>
    <text x="722" y="632" fill="#555">(red and brown share those pins)</text>
  </g>
  </g>
</svg>
