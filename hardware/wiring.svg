<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <title>Ripe-O-Matic wiring</title>
  <rect width="760" height="400" fill="#f6f5ef"/>

  <!-- ESP32 -->
  <rect x="40" y="60" width="150" height="280" rx="8" fill="#23272b" stroke="#111" />
  <rect x="60" y="80" width="110" height="60" rx="3" fill="#9aa3ab"/>
  <text x="115" y="115" text-anchor="middle" fill="#23272b" font-weight="600">ESP32</text>
  <text x="115" y="150" text-anchor="middle" fill="#cfd5db" font-size="11">30-pin DevKit</text>
  <rect x="100" y="320" width="30" height="14" rx="2" fill="#9aa3ab"/>
  <text x="115" y="352" text-anchor="middle" fill="#444" font-size="11">USB · 5 V in</text>
  <!-- right-side pins -->
  <g fill="#e6c25a" font-size="11">
    <rect x="186" y="170" width="8" height="6"/><text x="178" y="176" text-anchor="end" fill="#fff">VIN 5V</text>
    <rect x="186" y="190" width="8" height="6"/><text x="178" y="196" text-anchor="end" fill="#fff">GND</text>
    <rect x="186" y="214" width="8" height="6"/><text x="178" y="220" text-anchor="end" fill="#fff">GPIO16</text>
    <rect x="186" y="230" width="8" height="6"/><text x="178" y="236" text-anchor="end" fill="#fff">GPIO17</text>
    <rect x="186" y="246" width="8" height="6"/><text x="178" y="252" text-anchor="end" fill="#fff">GPIO18</text>
    <rect x="186" y="262" width="8" height="6"/><text x="178" y="268" text-anchor="end" fill="#fff">GPIO19</text>
    <rect x="186" y="294" width="8" height="6"/><text x="178" y="300" text-anchor="end" fill="#fff">GPIO25 (v2 servo)</text>
  </g>
  <!-- left-side pins -->
  <g fill="#e6c25a" font-size="11">
    <rect x="36" y="170" width="8" height="6"/><text x="52" y="176" fill="#fff">3V3</text>
    <rect x="36" y="190" width="8" height="6"/><text x="52" y="196" fill="#fff">GND</text>
    <rect x="36" y="230" width="8" height="6"/><text x="52" y="236" fill="#fff">GPIO34</text>
  </g>

  <!-- ULN2003 -->
  <rect x="330" y="150" width="150" height="150" rx="6" fill="#2f6d3b" stroke="#1d4a26"/>
  <text x="405" y="175" text-anchor="middle" fill="#fff" font-weight="600">ULN2003 driver</text>
  <g fill="#e6c25a" font-size="11">
    <rect x="326" y="200" width="8" height="6"/><text x="342" y="206" fill="#fff">VCC</text>
    <rect x="326" y="216" width="8" height="6"/><text x="342" y="222" fill="#fff">GND</text>
    <rect x="326" y="240" width="8" height="6"/><text x="342" y="246" fill="#fff">IN1</text>
    <rect x="326" y="256" width="8" height="6"/><text x="342" y="262" fill="#fff">IN2</text>
    <rect x="326" y="272" width="8" height="6"/><text x="342" y="278" fill="#fff">IN3</text>
    <rect x="326" y="288" width="8" height="6"/><text x="342" y="294" fill="#fff">IN4</text>
  </g>
  <rect x="470" y="210" width="16" height="40" fill="#f1f1ec" stroke="#999"/>
  <text x="460" y="268" fill="#fff" font-size="11" text-anchor="end">motor plug</text>

  <!-- motor -->
  <circle cx="620" cy="230" r="40" fill="#b9bec4" stroke="#7d848c"/>
  <circle cx="620" cy="230" r="8" fill="#7d848c"/>
  <text x="620" y="300" text-anchor="middle" fill="#333">28BYJ-48</text>
  <path d="M486 230 C 520 230, 540 230, 580 230" stroke="#f1f1ec" stroke-width="6" fill="none"/>
  <path d="M486 230 C 520 230, 540 230, 580 230" stroke="#999" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <text x="533" y="212" text-anchor="middle" fill="#555" font-size="11">stock 5-wire ribbon</text>

  <!-- wires ESP32 -> ULN -->
  <g fill="none" stroke-width="2">
    <path d="M194 173 L 326 203" stroke="#d14b3f"/>
    <path d="M194 193 L 326 219" stroke="#222"/>
    <path d="M194 217 L 326 243" stroke="#e2a33b"/>
    <path d="M194 233 L 326 259" stroke="#e2a33b"/>
    <path d="M194 249 L 326 275" stroke="#e2a33b"/>
    <path d="M194 265 L 326 291" stroke="#e2a33b"/>
  </g>

  <!-- hall sensor -->
  <rect x="330" y="40" width="34" height="36" rx="3" fill="#2a2d31"/>
  <text x="347" y="63" text-anchor="middle" fill="#fff" font-size="11">49E</text>
  <text x="400" y="100" fill="#333" font-weight="600">SS49E hall sensor</text>
  <text x="400" y="116" fill="#555" font-size="11">on the sled's post, 1.5 mm behind the magnet, flat face toward it</text>
  <g stroke="#9aa3ab" stroke-width="2">
    <line x1="336" y1="76" x2="336" y2="96"/><line x1="347" y1="76" x2="347" y2="96"/><line x1="358" y1="76" x2="358" y2="96"/>
  </g>
  <g fill="#555" font-size="10">
    <text x="330" y="110" text-anchor="end">1 (+)</text><text x="347" y="118" text-anchor="middle">2 (−)</text><text x="364" y="110">3 (out)</text>
  </g>
  <!-- capacitor between out (358) and GND (347) -->
  <g stroke="#333" stroke-width="2">
    <line x1="347" y1="96" x2="347" y2="128"/><line x1="358" y1="96" x2="358" y2="128"/>
    <line x1="340" y1="128" x2="354" y2="128"/><line x1="351" y1="128" x2="365" y2="128"/>
  </g>
  <rect x="340" y="124" width="25" height="8" fill="#f6f5ef"/>
  <line x1="340" y1="125" x2="365" y2="125" stroke="#333" stroke-width="2"/>
  <line x1="340" y1="131" x2="365" y2="131" stroke="#333" stroke-width="2"/>
  <text x="375" y="131" fill="#333" font-size="11">0.1 µF, right at the sensor</text>

  <!-- wires ESP32 left pins -> hall sensor (route around the top) -->
  <g fill="none" stroke-width="2">
    <path d="M36 173 C 10 173, 10 20, 120 20 L 336 20 L 336 40" stroke="#d14b3f"/>
    <path d="M36 193 C 20 193, 20 30, 125 30 L 300 30 L 300 140 L 347 140 L 347 131" stroke="#222"/>
    <path d="M36 233 C 15 233, 15 40, 130 40 L 290 40 L 290 150 L 358 150 L 358 131" stroke="#2d5fb3"/>
  </g>
  <text x="130" y="16" fill="#d14b3f" font-size="10">3V3 → pin 1</text>
  <text x="130" y="46" fill="#2d5fb3" font-size="10">GPIO34 ← pin 3 (out)</text>

  <!-- legend -->
  <g font-size="11" fill="#333">
    <rect x="520" y="330" width="14" height="4" fill="#d14b3f"/><text x="540" y="335">5 V / 3V3</text>
    <rect x="520" y="346" width="14" height="4" fill="#222"/><text x="540" y="351">GND</text>
    <rect x="520" y="362" width="14" height="4" fill="#e2a33b"/><text x="540" y="367">motor phases IN1–IN4</text>
    <rect x="520" y="378" width="14" height="4" fill="#2d5fb3"/><text x="540" y="383">hall signal (ADC1 only: GPIO 32–39)</text>
  </g>
  <text x="640" y="60" text-anchor="middle" fill="#555" font-size="11">Everything runs on the ESP32's 5 V (VIN)</text>
  <text x="640" y="76" text-anchor="middle" fill="#555" font-size="11">from a phone charger over USB.</text>
</svg>
