# Publishes the project site to GitHub Pages: https://btltech1.github.io/ripeomatic/
#   /            the community dashboard (dashboard/index.html + data/)
#   /install/    the web installer (install/index.html + freshly built firmware)
name: pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "install/**"
      - "data/all.csv"
      - "data/sample/**"
      - "firmware/ripeomatic/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  firmware:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: firmware
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: fw
          merge-multiple: true
      - name: Assemble the site
        run: |
          set -e
          mkdir -p _site/data/sample _site/install/firmware
          cp dashboard/index.html _site/index.html
          cp data/all.csv _site/data/all.csv 2>/dev/null || true
          cp data/sample/sample.csv _site/data/sample/sample.csv
          cp install/index.html _site/install/index.html
          cp fw/*.bin _site/install/firmware/
          VERSION=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' firmware/ripeomatic/config.h)
          BUILD="$(date -u +%Y-%m-%d) · ${GITHUB_SHA:0:7}"
          for v in ripeomatic ripeomatic-simulate; do
            suffix=""; [ "$v" = "ripeomatic-simulate" ] && suffix="-simulate"
            cat > "_site/install/firmware/manifest${suffix}.json" <<EOF
          {
            "name": "BTL Ripe-O-Matic",
            "version": "${VERSION}${suffix}",
            "build": "${BUILD}",
            "build_id": "${GITHUB_SHA:0:7}",
            "new_install_prompt_erase": false,
            "new_install_improv_wait_time": 20,
            "builds": [
              { "chipFamily": "ESP32", "improv": true, "parts": [
                { "path": "${v}.bootloader.bin", "offset": 4096 },
                { "path": "${v}.partitions.bin", "offset": 32768 },
                { "path": "boot_app0.bin", "offset": 57344 },
                { "path": "${v}.app.bin", "offset": 65536 }
              ] }
            ]
          }
          EOF
          done
          ls -laR _site | head -40
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
